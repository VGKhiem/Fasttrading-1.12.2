buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = "2.0"
group = "com.vgkhiem.fasttrading"
archivesBaseName = "FastTrading-1.12.2"

sourceCompatibility = targetCompatibility = '1.8'
compileJava {
    sourceCompatibility = targetCompatibility = '1.8'
}

minecraft {
    version = "1.12.2-14.23.5.2847"
    runDir = "run"
    mappings = "stable_39"
}

jar {
    manifest {
        attributes([
            "FMLCorePluginContainsFMLMod": "true",
            "FMLAT": "fasttrading_at.cfg",
            "FMLCorePlugin": "com.vgkhiem.fasttrading.asm.CoreModBase"
        ])
    }
}
