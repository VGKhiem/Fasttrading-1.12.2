buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = "2.0"
group = "com.vgkhiem.khyxultilities"
archivesBaseName = "KhyxUltilities-1.12.2"

sourceCompatibility = targetCompatibility = '1.8'
compileJava {
    sourceCompatibility = targetCompatibility = '1.8'
}

minecraft {
    version = "1.12.2-14.23.5.2847"
    runDir = "run"
    mappings = "stable_39"
}

jar {
    manifest {
        attributes([
            "FMLCorePluginContainsFMLMod": "true",
            "FMLAT": "fasttrading_at.cfg",
            "FMLCorePlugin": "com.vgkhiem.khyxultilities.asm.CoreModBase"
        ])
    }
}

eclipse {
    project {
        name = "KhyxUltilities-1.12.2"
    }
    classpath {
        file {
            whenMerged { cp ->
                cp.entries.removeAll { it.kind == 'src' && it.path.contains('resources') }
                cp.entries.removeAll { it.kind == 'lib' && it.path.endsWith('/start') }
                cp.entries.findAll { it.kind == 'con' && it.path.contains('JRE_CONTAINER') }.each {
                    it.path = 'org.eclipse.jdt.launching.JRE_CONTAINER'
                }
            }
        }
    }
}

afterEvaluate {
    tasks.findByName('build')?.group = 'build setup'
    tasks.findByName('clean')?.group = 'build setup'
}
